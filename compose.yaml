name: ai-db-workbench
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      AGENT_URL: http://agent:3001
      RUST_LOG: info
    volumes:
      - app-data:/data
      - internal-auth:/run/workbench
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      APP_URL: http://app:8080
      PI_PROVIDER: ${PI_PROVIDER:-openai-compatible}
      PI_MODEL: ${PI_MODEL:-}
      PI_API_KEY: ${PI_API_KEY:-}
      PI_BASE_URL: ${PI_BASE_URL:-}
    volumes:
      - internal-auth:/run/workbench:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  app-data:
  internal-auth:
